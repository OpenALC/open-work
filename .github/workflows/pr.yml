name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '24'
  PNPM_VERSION: '10'

jobs:
  # ─── 门禁类：最先执行，失败即快速反馈 ───────────────────────────
  commit-lint:
    name: commit-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Fetch base branch
        run: git fetch --no-tags origin +refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
      - name: Validate commit messages
        run: |
          npx --yes @commitlint/cli@19 \
            --config commitlint.config.mjs \
            --from origin/${{ github.base_ref }} \
            --to HEAD \
            --verbose

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan history and diff
        run: |
          gitleaks detect --source . --redact --no-banner --verbose

  # ─── 骨架检测与变更范围 ───────────────────────────────────────
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      flutter: ${{ steps.filter.outputs.flutter }}
      db: ${{ steps.filter.outputs.db }}
      api: ${{ steps.filter.outputs.api }}
      docker: ${{ steps.filter.outputs.docker }}
      have_go: ${{ steps.skeleton.outputs.go }}
      have_web: ${{ steps.skeleton.outputs.web }}
      have_flutter: ${{ steps.skeleton.outputs.flutter }}
      have_api: ${{ steps.skeleton.outputs.api }}
      have_docker: ${{ steps.skeleton.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect skeleton presence
        id: skeleton
        run: |
          set -eu
          [ -f go.mod ]                         && echo "go=true"      >> "$GITHUB_OUTPUT" || echo "go=false"      >> "$GITHUB_OUTPUT"
          [ -f apps/web/package.json ]          && echo "web=true"     >> "$GITHUB_OUTPUT" || echo "web=false"     >> "$GITHUB_OUTPUT"
          [ -f apps/flutter/pubspec.yaml ]      && echo "flutter=true" >> "$GITHUB_OUTPUT" || echo "flutter=false" >> "$GITHUB_OUTPUT"
          [ -f docs/api/openapi.yaml ]          && echo "api=true"     >> "$GITHUB_OUTPUT" || echo "api=false"     >> "$GITHUB_OUTPUT"
          ls deploy/docker/*.Dockerfile >/dev/null 2>&1 \
                                                && echo "docker=true"  >> "$GITHUB_OUTPUT" || echo "docker=false"  >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'database/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            flutter:
              - 'apps/flutter/**'
            db:
              - 'database/migrations/**'
            api:
              - 'docs/api/**'
              - 'packages/contracts/**'
            docker:
              - 'deploy/**'
              - 'Dockerfile*'
              - 'cmd/**'

  # ─── Go ───────────────────────────────────────────────────────
  go-check:
    name: go-${{ matrix.task }}
    needs: changes
    if: needs.changes.outputs.go == 'true' && needs.changes.outputs.have_go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [fmt, vet, lint, tidy, sqlc]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go-fmt
        if: matrix.task == 'fmt'
        run: test -z "$(gofmt -l .)"
      - name: go-vet
        if: matrix.task == 'vet'
        run: go vet ./...
      - name: go-lint
        if: matrix.task == 'lint'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v1.62
          args: --timeout=10m
      - name: go-mod-tidy
        if: matrix.task == 'tidy'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: sqlc-check
        if: matrix.task == 'sqlc'
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.27.0 generate
          git diff --exit-code

  go-test:
    name: go-test
    needs: changes
    if: needs.changes.outputs.go == 'true' && needs.changes.outputs.have_go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build ./...
      - name: Unit tests
        run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
      - uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 7

  go-integration:
    name: go-integration
    needs: changes
    if: needs.changes.outputs.go == 'true' && needs.changes.outputs.have_go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: openwork_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      OPENWORK_DB_DSN: root:root@tcp(127.0.0.1:3306)/openwork_test?parseTime=true&loc=UTC&multiStatements=true
      OPENWORK_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Migrate
        run: go run github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1 -path database/migrations/mysql -database "mysql://$OPENWORK_DB_DSN" up
      - name: Integration tests
        run: go test -tags=integration -race -shuffle=on -timeout=20m ./...

  tenant-scope:
    name: tenant-scope
    needs: changes
    if: needs.changes.outputs.go == 'true' && needs.changes.outputs.have_go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Check tenant scoping in SQL
        run: go run ./scripts/lint/tenantscope

  # ─── Web ──────────────────────────────────────────────────────
  web:
    name: web-${{ matrix.task }}
    needs: changes
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.have_web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, build, test]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: lint
        if: matrix.task == 'lint'
        run: pnpm -r --if-present run lint
      - name: typecheck
        if: matrix.task == 'typecheck'
        run: pnpm -r --if-present run typecheck
      - name: build
        if: matrix.task == 'build'
        run: pnpm -r --if-present run build
      - name: test
        if: matrix.task == 'test'
        run: pnpm -r --if-present run test

  # ─── Flutter ──────────────────────────────────────────────────
  flutter:
    name: flutter-${{ matrix.task }}
    needs: changes
    if: needs.changes.outputs.flutter == 'true' && needs.changes.outputs.have_flutter == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: [analyze, test, build]
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: analyze
        if: matrix.task == 'analyze'
        run: |
          flutter analyze --fatal-infos --fatal-warnings
          dart format --output=none --set-exit-if-changed .
      - name: test
        if: matrix.task == 'test'
        run: flutter test --coverage
      - name: build
        if: matrix.task == 'build'
        run: flutter build apk --debug

  # ─── 契约与数据库 ─────────────────────────────────────────────
  openapi:
    name: openapi-${{ matrix.task }}
    needs: changes
    if: needs.changes.outputs.api == 'true' && needs.changes.outputs.have_api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        task: [lint, breaking, codegen]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Fetch base branch
        run: git fetch --no-tags origin +refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
      - name: lint
        if: matrix.task == 'lint'
        run: npx --yes @stoplight/spectral-cli@6 lint docs/api/openapi.yaml --ruleset .spectral.yaml
      - name: breaking change detection
        if: matrix.task == 'breaking'
        run: |
          mkdir -p /tmp/base
          if git show "origin/${{ github.base_ref }}:docs/api/openapi.yaml" > /tmp/base/openapi.yaml 2>/dev/null; then
            npx --yes oasdiff@1 breaking /tmp/base/openapi.yaml docs/api/openapi.yaml --fail-on ERR
          else
            echo "基线分支没有 OpenAPI 文件，跳过破坏性变更检查"
          fi
      - name: codegen drift
        if: matrix.task == 'codegen'
        run: |
          make openapi-gen
          git diff --exit-code

  migration-check:
    name: migration-check
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: openwork_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Fetch base branch
        run: git fetch --no-tags origin +refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
      - name: Merged migrations are immutable
        run: |
          CHANGED=$(git diff --name-status "origin/${{ github.base_ref }}" -- database/migrations/mysql \
            | awk '$1 ~ /^[MD]/ {print $2}')
          if [ -n "$CHANGED" ]; then
            echo "已合并的迁移文件不得修改或删除："
            echo "$CHANGED"
            exit 1
          fi
      - name: Up / Down / Up must be repeatable
        env:
          DSN: mysql://root:root@tcp(127.0.0.1:3306)/openwork_test
        run: |
          set -eu
          MIGRATE="go run github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1 -path database/migrations/mysql -database $DSN"
          $MIGRATE up
          $MIGRATE down -all
          $MIGRATE up

  # ─── 安全 ─────────────────────────────────────────────────────
  security:
    name: security-${{ matrix.task }}
    needs: changes
    if: needs.changes.outputs.go == 'true' && needs.changes.outputs.have_go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [govulncheck, license]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        if: matrix.task == 'govulncheck'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: license-check
        if: matrix.task == 'license'
        run: go run ./scripts/lint/licenses

  # ─── 构建 ─────────────────────────────────────────────────────
  docker:
    name: docker-build
    needs: changes
    if: needs.changes.outputs.docker == 'true' && needs.changes.outputs.have_docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [server, realtime, worker]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/${{ matrix.service }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: openwork-${{ matrix.service }}:ci

  # ─── 汇总 ─────────────────────────────────────────────────────
  pr-summary:
    name: pr-summary
    if: always()
    needs:
      - commit-lint
      - secrets-scan
      - go-check
      - go-test
      - go-integration
      - tenant-scope
      - web
      - flutter
      - openapi
      - migration-check
      - security
      - docker
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "以下检查未通过，请修复后重试："
          echo '${{ toJSON(needs) }}'
          exit 1
