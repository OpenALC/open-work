name: Release

on:
  push:
    # glob 语法（不是正则）：[0-9] 匹配一位数字，* 匹配任意字符
    # 因此 v0.10.3、v0.100.12、v0.10.0-rc.3 都能触发，支持任意位数
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-*'

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: '1.25'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/open-work

jobs:
  # ─── 校验 ─────────────────────────────────────────────────────
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      major_minor: ${{ steps.v.outputs.major_minor }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major_minor=$(echo "$VERSION" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
      - name: tag 必须在 main 上
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "标签必须打在 main 的可达提交上"; exit 1; }
      - name: CHANGELOG 必须有本版本段落
        run: |
          V="${GITHUB_REF#refs/tags/v}"
          grep -qE "^## \[${V}\]" CHANGELOG.md || { echo "CHANGELOG.md 缺少 [$V]"; exit 1; }

  # ─── 二进制 ───────────────────────────────────────────────────
  binaries:
    name: binary-${{ matrix.os }}-${{ matrix.arch }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -eu
          EXT=""; [ "$GOOS" = "windows" ] && EXT=".exe"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::7}"
          mkdir -p dist
          for svc in server realtime worker; do
            go build -trimpath -ldflags "$LDFLAGS" \
              -o "dist/openwork-${svc}_${VERSION}_${GOOS}_${GOARCH}${EXT}" \
              "./cmd/openwork-${svc}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 7

  # ─── 镜像 ─────────────────────────────────────────────────────
  images:
    name: image-${{ matrix.service }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [server, realtime, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ needs.preflight.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ needs.preflight.outputs.version }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ needs.preflight.outputs.major_minor }}
          labels: |
            org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

  # ─── 客户端 ───────────────────────────────────────────────────
  flutter:
    name: flutter-${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: apk, os: ubuntu-24.04 }
          - { target: appbundle, os: ubuntu-24.04 }
          - { target: web, os: ubuntu-24.04 }
          - { target: linux, os: ubuntu-24.04 }
          - { target: windows, os: windows-2025 }
          - { target: macos, os: macos-15 }
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f pubspec.yaml ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: stable
          cache: true
      - if: steps.check.outputs.exists == 'true'
        run: |
          flutter pub get
          flutter build ${{ matrix.target }} --release
      - if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ matrix.target }}
          path: apps/flutter/build/${{ matrix.target }}/**
          retention-days: 7
          if-no-files-found: warn

  # ─── 发布 ─────────────────────────────────────────────────────
  publish:
    name: publish
    needs: [preflight, binaries, images, flutter]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 汇总与校验和
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \; 2>/dev/null || true
          cd release && sha256sum * > SHA256SUMS 2>/dev/null || true
      - name: 提取 Release Notes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\["v"\\]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $VERSION" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.preflight.outputs.version }}
          body_path: notes.md
          draft: true
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          files: release/*
