name: Nightly

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '24'
  PNPM_VERSION: '10'

jobs:
  full-integration:
    name: full-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: openwork_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      OPENWORK_DB_DSN: root:root@tcp(127.0.0.1:3306)/openwork_test?parseTime=true&loc=UTC&multiStatements=true
      OPENWORK_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go run github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1 -path database/migrations/mysql -database "mysql://$OPENWORK_DB_DSN" up
      - name: Integration suite (shuffle x2)
        run: go test -tags=integration -race -shuffle=on -count=2 -timeout=40m ./...

  concurrency-stress:
    name: concurrency-stress
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: openwork_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      OPENWORK_DB_DSN: root:root@tcp(127.0.0.1:3306)/openwork_test?parseTime=true&loc=UTC&multiStatements=true
      OPENWORK_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go run github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1 -path database/migrations/mysql -database "mysql://$OPENWORK_DB_DSN" up
      - name: Outbox / WS / workflow concurrency tests
        run: |
          go test -tags="integration stress" -race -timeout=35m \
            ./internal/infrastructure/outbox/... \
            ./cmd/openwork-realtime/... \
            ./internal/workflow/...

  tenant-isolation-fuzz:
    name: tenant-isolation-fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: openwork_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      OPENWORK_DB_DSN: root:root@tcp(127.0.0.1:3306)/openwork_test?parseTime=true&loc=UTC&multiStatements=true
      OPENWORK_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go run github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1 -path database/migrations/mysql -database "mysql://$OPENWORK_DB_DSN" up
      - name: Cross-tenant fuzz
        run: go test -tags=integration -run TestTenantIsolation -count=3 -timeout=25m ./...

  db-compat:
    name: db-compat
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Migration on empty and historical schemas
        run: make db-compat-check

  perf-smoke:
    name: perf-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Benchmarks vs baseline
        run: make bench-check

  flutter-full-build:
    name: flutter-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: android, os: ubuntu-24.04 }
          - { target: web, os: ubuntu-24.04 }
          - { target: linux, os: ubuntu-24.04 }
          - { target: windows, os: windows-2025 }
          - { target: macos, os: macos-15 }
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release

  notify:
    name: notify-failure
    needs:
      - full-integration
      - concurrency-stress
      - tenant-isolation-fuzz
      - db-compat
      - perf-smoke
      - flutter-full-build
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Open issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `nightly 失败 ${date}`,
              body: `Nightly 流水线失败，请查看运行：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['nightly-failure', 'ci'],
            });
