name: Main

on:
  push:
    branches: [main]

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '24'
  PNPM_VERSION: '10'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/open-work

jobs:
  # 仓库骨架阶段（尚无 go.mod / 前端包）时跳过构建类检查，M0 落地后自动生效
  detect:
    name: detect
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      go: ${{ steps.check.outputs.go }}
      web: ${{ steps.check.outputs.web }}
      flutter: ${{ steps.check.outputs.flutter }}
      docker: ${{ steps.check.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          [ -f go.mod ] && echo "go=true" >> "$GITHUB_OUTPUT" || echo "go=false" >> "$GITHUB_OUTPUT"
          [ -f apps/web/package.json ] && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"
          [ -f apps/flutter/pubspec.yaml ] && echo "flutter=true" >> "$GITHUB_OUTPUT" || echo "flutter=false" >> "$GITHUB_OUTPUT"
          ls deploy/docker/*.Dockerfile >/dev/null 2>&1 && echo "docker=true" >> "$GITHUB_OUTPUT" || echo "docker=false" >> "$GITHUB_OUTPUT"

  gates:
    name: gates
    needs: detect
    if: needs.detect.outputs.go == 'true' || needs.detect.outputs.web == 'true' || needs.detect.outputs.flutter == 'true'
    uses: ./.github/workflows/reusable-gates.yml

  coverage:
    name: coverage
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Collect coverage
        run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  race-stress:
    name: race-stress
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: openwork_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      OPENWORK_DB_DSN: root:root@tcp(127.0.0.1:3306)/openwork_test?parseTime=true&loc=UTC&multiStatements=true
      OPENWORK_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Migrate
        run: go run github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1 -path database/migrations/mysql -database "mysql://$OPENWORK_DB_DSN" up
      - name: Race stress on critical packages
        run: |
          go test -tags=integration -race -count=5 -timeout=20m \
            ./internal/infrastructure/outbox/... \
            ./internal/im/... \
            ./internal/workflow/... \
            ./internal/authorization/...

  e2e-full:
    name: e2e-full
    needs: detect
    if: needs.detect.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Bring up stack
        run: docker compose -f deploy/compose/docker-compose.e2e.yml up -d --wait --wait-timeout 180
      - name: Run e2e
        run: make e2e
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.e2e.yml logs --no-color
      - name: Teardown
        if: always()
        run: docker compose -f deploy/compose/docker-compose.e2e.yml down -v

  image:
    name: image-${{ matrix.service }}
    needs: [gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [server, realtime, worker]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:edge
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:main-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  sbom:
    name: sbom
    needs: [image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: openwork-sbom.spdx.json
