version: 2
updates:
  # ─── GitHub Actions ───────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: UTC
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'
    labels: ['dependencies', 'ci']

  # ─── Node / pnpm ──────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(deps)'
    labels: ['dependencies', 'web']

  # ─────────────────────────────────────────────────────────────
  # 以下条目在对应骨架落地后启用（M0 / L0.1）。
  # 提前启用会让 Dependabot 因目录或清单文件不存在而持续报错。
