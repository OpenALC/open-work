run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - contextcheck
    - dupl
    - errorlint
    - exhaustive
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gosec
    - lll
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - stylecheck
    - thelper
    - tparallel
    - unconvert
    - unparam
    - whitespace
    - wrapcheck
  disable:
    - depguard

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  gocyclo:
    min-complexity: 20

  gocognit:
    min-complexity: 30

  goconst:
    min-len: 3
    min-occurrences: 4

  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow

  lll:
    line-length: 120

  misspell:
    locale: US

  nolintlint:
    require-explanation: true
    require-specific: true
    allow-unused: false

  revive:
    rules:
      - name: exported
      - name: package-comments
      - name: var-naming
      - name: indent-error-flow
      - name: error-strings
      - name: context-as-argument
      - name: context-keys-type
      - name: early-return

  wrapcheck:
    ignoreSigs:
      - .Errorf(
      - errors.New(
      - errors.Join(
      - .Wrap(

  dupl:
    threshold: 150

  gosec:
    excludes:
      - G104 # 已由 errcheck 覆盖

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # 测试文件放宽复杂度与重复度要求
    - path: _test\.go
      linters:
        - dupl
        - gocyclo
        - gocognit
        - errcheck
        - gosec
        - wrapcheck

    # 生成代码不做检查
    - path: database/generated/
      linters:
        - lll
        - stylecheck
        - revive
        - dupl
        - gosec
        - wrapcheck
    - path: packages/contracts/generated/
      linters:
        - lll
        - stylecheck
        - revive

    # main 包允许直接打印到 stderr
    - path: cmd/
      linters:
        - wrapcheck
